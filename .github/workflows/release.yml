name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # to be able to publish a GitHub release
  issues: write # to be able to comment on released issues
  pull-requests: write # to be able to comment on released pull requests
  id-token: write # to enable use of OIDC for npm provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Install dependencies
        run: npm ci

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures

      - name: Run tests
        run: npm test

      - name: Run linting
        run: npm run lint

      - name: Verify generated distribution artifacts
        run: |
          npm run distribute:build
          npm run distribute:check

      - name: Verify isolated Pi publication
        env:
          EVCRATE_HOME: ${{ runner.temp }}/evcrate-pi-home
          EVCRATE_STATE_HOME: ${{ runner.temp }}/evcrate-pi-state
        run: |
          python3 distribute.py --publish --dry-run --json
          python3 distribute.py --publish
          python3 distribute.py --publish --dry-run --json
          npm pack --dry-run

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run semantic-release
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # to be able to publish a GitHub release
  issues: write # to be able to comment on released issues
  pull-requests: write # to be able to comment on released pull requests

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript CLI
        run: npm run build

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures

      - name: Run TypeScript protocol tests
        run: npm run test:protocol

      - name: Run TypeScript CLI tests
        run: npm run test:cli

      - name: Run legacy tests
        run: npm test

      - name: Run linting
        run: npm run lint

      - name: Verify generated distribution artifacts
        run: |
          npm run distribute:build
          npm run distribute:check

      - name: Run distribution and release tests
        run: |
          chmod +x install.sh
          npm run test:release
          npm run test:installer:linux
          npm run test:distribution:rollout

      - name: Verify publication smoke test
        env:
          EVCRATE_HOME: ${{ runner.temp }}/evcrate-test-home
          EVCRATE_STATE_HOME: ${{ runner.temp }}/evcrate-test-state
        run: |
          node dist/cli/evcrate.js publish --dry-run --json
          node dist/cli/evcrate.js publish --apply
          node dist/cli/evcrate.js publish --dry-run --json
          npm pack --dry-run

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run semantic-release